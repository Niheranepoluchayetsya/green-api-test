<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GREEN-API Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            background: #f2f2f2;
            padding: 20px;
            border-radius: 10px;
        }
        input, textarea, button {
            width: 100%;
            margin: 8px 0;
            padding: 8px;
            font-size: 16px;
        }
        textarea {
            height: 200px;
            resize: none;
        }
        button {
            cursor: pointer;
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
        button:hover {
            background: #43a047;
        }
    </style>
</head>
<body>

<h2>GREEN-API Test Page</h2>

<label>ID Instance:</label>
<input type="text" id="idInstance">

<label>API Token Instance:</label>
<input type="text" id="apiTokenInstance">

<hr>

<button onclick="getSettings()">getSettings</button>
<button onclick="getStateInstance()">getStateInstance</button>

<h3>Send Message</h3>
<input type="text" id="chatId" placeholder="Например: 77001234567@c.us">
<input type="text" id="messageText" placeholder="Текст сообщения">
<button onclick="sendMessage()">sendMessage</button>

<h3>Send File By URL</h3>
<input type="text" id="fileChatId" placeholder="77001234567@c.us">
<input type="text" id="fileUrl" placeholder="URL файла">
<input type="text" id="fileName" placeholder="Имя файла (example.jpg)">
<button onclick="sendFileByUrl()">sendFileByUrl</button>

<h3>Ответ:</h3>
<textarea id="response" readonly></textarea>

<script>
    function getBaseUrl() {
        const idInstance = document.getElementById("idInstance").value;
        const apiToken = document.getElementById("apiTokenInstance").value;
        return `https://api.green-api.com/waInstance${idInstance}`;
    }

    function printResponse(data) {
        document.getElementById("response").value = JSON.stringify(data, null, 2);
    }

    async function getSettings() {
        const url = getBaseUrl() + `/getSettings/${apiTokenInstance.value}`;
        const res = await fetch(url);
        printResponse(await res.json());
    }

    async function getStateInstance() {
        const url = getBaseUrl() + `/getStateInstance/${apiTokenInstance.value}`;
        const res = await fetch(url);
        printResponse(await res.json());
    }

    async function sendMessage() {
        const url = getBaseUrl() + `/sendMessage/${apiTokenInstance.value}`;
        const body = {
            chatId: document.getElementById("chatId").value,
            message: document.getElementById("messageText").value
        };

        const res = await fetch(url, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });
        printResponse(await res.json());
    }

    async function sendFileByUrl() {
        const url = getBaseUrl() + `/sendFileByUrl/${apiTokenInstance.value}`;
        const body = {
            chatId: document.getElementById("fileChatId").value,
            urlFile: document.getElementById("fileUrl").value,
            fileName: document.getElementById("fileName").value
        };

        const res = await fetch(url, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });
        printResponse(await res.json());
    }
</script>

</body>
</html>
